name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Verify Godot
        run: godot --version

      - name: Import project
        run: godot --headless --editor --quit

      - name: Run tests
        run: godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://tests/unit -gexit