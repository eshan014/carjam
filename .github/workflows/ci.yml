name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Verify Godot
        run: godot --version

      - name: Import project
        run: godot --headless --editor --quit

      - name: Run tests
        run: godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://tests/unit -gexit
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: gdlint src tests

      - name: Check formatting
        run: gdformat --check src tests